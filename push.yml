name: daily-push
on:
  schedule:
    - cron: '30 23 * * *'      # UTC 23:30 = 한국 시간 아침 08:30 (몇 분~수십 분 늦을 수 있음)
  workflow_dispatch:            # Actions 탭에서 수동 실행(테스트용)
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node send-push.mjs
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
