name: daily-push
on:
  schedule:
    - cron: '17 23 * * *'      # UTC 23:17 = 한국 시간 아침 08:17 (1차)
    - cron: '47 23 * * *'      # UTC 23:47 = 한국 시간 아침 08:47 (1차가 빠졌을 때를 위한 예비)
  workflow_dispatch:            # Actions 탭에서 수동 실행(테스트용)
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node send-push.mjs
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
